domain: "Machine Learning"
task_name: "PLTV"
description: |
  Our goal is to predict a user's lifetime value (LTV) on day 60 based on data from the first ten days of installation. This is a regression problem.
    Key Features:
    -Both the training and test sets are tabular data, distinguishing users by device_id. Each user has seven rows representing all their data.
    -The deposit column represents the user's recharge amount. This feature has a strong correlation with   the target prediction value and can be paid more attention to.
    -For the CSV file containing the data, each seven rows represent a user's activity since installation, including numerical, date, and categorical data. We want to predict the 'REC_USD_D60' column in the last row for each user, representing the user's recharges over the past 60 days. You can use a time series model to model this user data.
    -There are three CSV files: traindata.csv (training set), valdata.csv (validation set), and testdata.csv (test set).
evaluation_metric: | 
    NormGINI,this is how it's calculated(python code):
    def cumulative_true(y_true, y_pred) -> np.ndarray:
        df = pd.DataFrame({
          'y_true': y_true,
          'y_pred': y_pred,
        }).sort_values(
          by='y_pred', ascending=False)
        return (df['y_true'].cumsum() / df['y_true'].sum()).values
    def gini_from_gain(df: pd.DataFrame) -> pd.DataFrame:
        raw = df.apply(lambda x: 2 * x.sum() / df.shape[0] - 1.)
        normalized = raw / raw[0]
        return pd.DataFrame({
          'raw': raw,
          'normalized': normalized
        })[['raw', 'normalized']]"

    
higher_is_better: true

secondary_metrics:
  - "error_rate, This is how it's calculated(python code):error_rate = abs(test_true_sum - test_pred_sum) * 1.0 / test_true_sum"
  - "SPEARMAN, This is how it's calculated(python code):SPEARMAN = spearmanr(labels, predicts)"

